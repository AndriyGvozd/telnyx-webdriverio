services:
  # Official, pre-built browser images - each already bundles the right
  # browser + matching driver + a working virtual display for the host's
  # architecture, avoiding the whole class of "wrong binary downloaded"
  # problems that come with managing browsers ourselves in Docker.
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - '4444:4444'

  selenium-firefox:
    image: selenium/standalone-firefox:latest
    shm_size: 2gb
    ports:
      - '4445:4444'

  # Optional, same as npm run test:edge locally - Edge is Chromium-based
  # like Chrome, kept as its own container so it can be skipped freely.
  selenium-edge:
    image: selenium/standalone-edge:latest
    platform: linux/amd64
    shm_size: 2gb
    ports:
      - '4446:4444'

  tests:
    build: .
    depends_on:
      - selenium-chrome
      - selenium-firefox
    # selenium-edge isn't listed here on purpose (it's optional) - the
    # docker:test:edge script starts it explicitly instead of every run
    # paying to spin up a browser most runs don't need.
    environment:
      - TEST_ENV=prod
    volumes:
      - ./allure-results:/app/allure-results
    # Overridden per run, e.g.:
    #   docker compose run --rm -e SELENIUM_HOST=selenium-chrome tests npm run test:chrome
    command: npm run test:chrome
